name: PR checks

# Every pull request into main: backend tests, kiosk agent tests, frontend
# build. No AWS access of any kind - enforced two ways:
#   1. No `id-token` permission is granted anywhere in this file, so no job
#      here can even request an OIDC token to assume the deploy role.
#   2. Even if it could, the deploy role's trust policy (see
#      infra/terraform/modules/github_oidc/main.tf) only accepts tokens whose
#      `sub` claim is the environment-scoped, immutable-ID form
#      repo:<owner>@<owner-id>/<repo>@<repo-id>:environment:dev. GitHub only
#      issues that sub to a job that declares `environment: dev`; no job here
#      does, so AWS itself would reject its token. A job that did declare it
#      would still be blocked by the "dev" GitHub environment, which only
#      allows deployments from main (a pull request runs on
#      refs/pull/<n>/merge).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
