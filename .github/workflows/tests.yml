name: Tests

# Backend tests, kiosk agent tests, frontend build.
# Runs on every push to main, and is called by pr-checks.yml (every PR) and
# deploy-dev.yml (before every manual deploy). Deliberately has no AWS
# access of any kind - no id-token permission, no AWS CLI calls, nothing
# that could touch the cloud. See pr-checks.yml for why
# that's also enforced independently of this file.
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: refund_user
          POSTGRES_PASSWORD: refund_test_pw
          POSTGRES_DB: refund_kiosk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U refund_user"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      # Two disposable databases: one for the main suite, one dedicated to
      # the migration up/down test (it drops every table in its database).
      TEST_DATABASE_URL: postgresql://refund_user:refund_test_pw@localhost:5432/refund_kiosk_test
      MIGRATION_TEST_DATABASE_URL: postgresql://refund_user:refund_test_pw@localhost:5432/refund_migration_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: self_refund_backend/requirements-dev.txt

      - name: Create the second disposable test database
        run: PGPASSWORD=refund_test_pw psql -h localhost -U refund_user -d refund_kiosk_test -c "CREATE DATABASE refund_migration_test;"

      - name: Install backend test dependencies
        # Pulls in kiosk_agent/requirements.txt too: the backend suite runs a
        # real in-process kiosk agent (mock hardware) against the Core API.
        working-directory: self_refund_backend
        run: pip install -r requirements-dev.txt

      - name: Run backend test suite
        working-directory: self_refund_backend
        run: python -m pytest -q

  kiosk-agent-tests:
    name: Kiosk agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kiosk_agent/requirements-dev.txt

      - name: Install system libraries opencv-python and hidapi need on Linux
        # Not needed by backend-tests: that job only ever runs mock hardware
        # and never imports these modules. tests/test_hardware_units.py here
        # imports hardware.camera_service directly, so cv2 must load for real.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libusb-1.0-0-dev libudev-dev

      - name: Install kiosk agent test dependencies
        working-directory: kiosk_agent
        run: pip install -r requirements-dev.txt

      - name: Run kiosk agent test suite
        working-directory: kiosk_agent
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: self_refund_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: self_refund_frontend
        run: npm ci

      - name: Build frontend
        working-directory: self_refund_frontend
        run: npm run build
